name: Development Workflow

on:
  push:
    branches: [DEV]




# Here the environment variable is declared in workflow level
env:
  # Replace with your Orchestrator Values 
  ORCH_URL: "https://staging.uipath.com/uipathtamindia"
  ORCH_TENANT: SagarSable
  ORCH_APP_ID: fb9a5e5c-bada-4dd8-aee3-a9144b601b41
  ORCH_APP_SECRET: A_8PNjkGulL#a9K@
  ORCH_ACC_NAME: UiPathTAMIndia
  ORCH_APP_SCOPES: "OR.Assets OR.BackgroundTasks OR.Execution OR.Folders OR.Jobs OR.Machines OR.Monitoring OR.Robots OR.Settings OR.TestSetExecutions OR.TestSets OR.TestSetSchedules OR.Users"
  CLI_File_Version: 23.10.8753.32995
  CLI_Folder_PATH: "C:\\"
  CLI_File_PATH: "C:\\uipathcli\\tools\\uipcli.exe"
  CLI_URL: "https://uipath.visualstudio.com/Public.Feeds/_artifacts/feed/UiPath-Official/NuGet/UiPath.CLI.Windows/overview/23.10.8753.32995"
  
#---------------------------------------------------------------------------------------   

jobs:
  Print-Environment-Variables:
    runs-on: [self-hosted, Windows, X64]
    #runs-on: self-hosted
    steps:
      - name: echo-default-env-variables
        run: |
          echo "Home: ${HOME}"
          echo "GITHUB_WORKFLOW: ${GITHUB_WORKFLOW}"
          echo "GITHUB_ACTIONS: ${GITHUB_ACTIONS}"
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME}"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "GITHUB_REF: ${GITHUB_REF}"
#---------------------------------------------------------------------------------------        
#  cleaner:
#    needs: print-details
#    runs-on: [self-hosted, Windows, X64]
#    #runs-on: self-hosted
#    steps:
#      - name: Runner workspace path
#        shell: powershell
#        run: |
#          echo "Cleaning up previous run"
#          Remove-Item "${{ github.workspace }}" -Recurse -Force
#---------------------------------------------------------------------------------------
  Get-UiPath-CLI:
    # You should be able to run on windows 2019 or windows latest
    needs: Print-Environment-Variables
    runs-on: [self-hosted, Windows, X64]
    #runs-on: self-hosted
    steps:
    - name: Get UiPath CLI
      shell: powershell
      run: |
              if (-Not (Test-Path -Path ${{env.CLI_File_PATH}})){
                  New-Item -Path ${{env.CLI_Folder_PATH}} -ItemType "directory" -Name "uipathcli" -Force | out-Null
                  Invoke-WebRequest "https://uipath.pkgs.visualstudio.com/Public.Feeds/_apis/packaging/feeds/1c781268-d43d-45ab-9dfc-0151a1c740b7/nuget/packages/UiPath.CLI.Windows/versions/${{env.CLI_File_Version}}/content" -OutFile "${{env.CLI_FOLDER_PATH}}\uipathcli\\cli.zip";
                  Expand-Archive -LiteralPath "${{env.CLI_FOLDER_PATH}}\uipathcli\\cli.zip" -DestinationPath "${{env.CLI_FOLDER_PATH}}\uipathcli";
              }      
#--------------------------------------------------------------------------------------
  Build-UiPath-NuGet-Package:
    # You should be able to run on windows 2019 or windows latest
    needs: Get-UiPath-CLI
    runs-on: [self-hosted, Windows, X64]
    #runs-on: self-hosted
    steps: 
      - name: Check out repository code
        # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it.
        uses: actions/checkout@v4
      - name: Build Nuget Package
        shell: powershell
        run:  ${{env.CLI_File_PATH}} package pack ${{ github.workspace }}\project.json -o ${{ github.workspace }}\package --autoVersion --outputType Process
      - name: Upload UiPath Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
           package/*.*
           scripts/*.ps1
  #--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
  Publish-UiPath-Nuget-Package-DEV:
    needs: Build-UiPath-NuGet-Package
    runs-on: [self-hosted, Windows, X64]
    #runs-on: self-hosted
    steps: 
      - name: Download UiPath Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts
      - name: Publish Nuget Package to DEV
        shell: powershell
        run: ${{env.CLI_File_PATH}} package deploy ${{ github.workspace }}\package ${{env.ORCH_URL}} ${{env.ORCH_TENANT}} -A${{env.ORCH_ACC_NAME}} -I ${{env.ORCH_APP_ID}}  -S ${{env.ORCH_APP_SECRET}} --applicationScope "OR.Assets OR.BackgroundTasks OR.Execution OR.Folders OR.Jobs OR.Machines OR.Monitoring OR.Robots OR.Settings OR.TestSetExecutions OR.TestSets OR.TestSetSchedules OR.Users" -o "Shared"
